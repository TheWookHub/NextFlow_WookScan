name: bips_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.7    # Specify a more exact version if BIPS has known compatibility, e.g., python=3.8
  - pandas>=1.3.5
  - numpy>=1.20.3
  - regex>=2021.1.18
  - matplotlib>=3.5.1
  - seaborn>=0.11.2
  - statannotations>=0.4.4
  - biopython>=1.79
  - scikit-learn
  - pip
  # If you had pip-only packages, it would look like this:
  # - pip:
  #   - package_name_from_pip
  #   - another_pip_package==1.2.3